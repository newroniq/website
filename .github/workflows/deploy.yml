name: Deploy GitHub Pages
on:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  validate:
    if: github.ref == 'refs/heads/master'
    uses: ./.github/workflows/ci.yml
  deploy:
    needs: validate
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/configure-pages@v5
      - name: Build production site
        run: |
          # Empty Actions variables must not shadow the public production defaults.
          if [ -z "$VITE_PUBLIC_POSTHOG_KEY" ]; then unset VITE_PUBLIC_POSTHOG_KEY; fi
          if [ -z "$VITE_PUBLIC_POSTHOG_HOST" ]; then unset VITE_PUBLIC_POSTHOG_HOST; fi
          npm run build
        env:
          VITE_PUBLIC_TALLY_FORM_ID: ${{ vars.VITE_PUBLIC_TALLY_FORM_ID || 'xVMoPv' }}
          VITE_PUBLIC_POSTHOG_KEY: ${{ vars.VITE_PUBLIC_POSTHOG_KEY }}
          VITE_PUBLIC_POSTHOG_HOST: ${{ vars.VITE_PUBLIC_POSTHOG_HOST }}
      - run: npm run test:smoke
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
