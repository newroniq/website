name: Validate
on:
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  validate:
    env:
      VITE_PUBLIC_TALLY_FORM_ID: ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run validate:content
      - run: npm test
      - run: npm run build
      - run: npm run test:smoke
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Build isolated integration fixture
        run: npm run build
        env:
          VITE_PUBLIC_TALLY_FORM_ID: newroniqTestForm
          VITE_PUBLIC_POSTHOG_KEY: phc_test_public
      - name: Verify consent and provider boundaries without live traffic
        run: npm run test:e2e -- integrations.spec.ts --project=desktop --workers=1
        env:
          TEST_INTEGRATIONS: '1'
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: browser-test-results
          path: |
            test-results/
            playwright-report/
          retention-days: 7
      - name: Verify project Pages build
        run: npm run build && npm run test:smoke
        env:
          SITE_BASE_PATH: /website/
          SITE_URL: https://newroniq.github.io/website/
      - name: Verify project Pages browser routes
        run: npm run test:e2e -- project-path
        env:
          SITE_BASE_PATH: /website/
          SITE_URL: https://newroniq.github.io/website/
